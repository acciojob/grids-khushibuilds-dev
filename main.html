<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Responsive Grid Layout</title>
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body>

  <!-- Main Fixed Width Container -->
  <div class="container-fluid p-0" style="width: 600px; border: 5px solid rgb(4, 255, 4); background-color: rgb(41, 0, 0);">
    
    <!-- Row 1 -->
    <div class="row g-0" style="border: 5px solid rgb(255, 188, 188); height: 200px;">
      <div class="col-sm-6 col-md-4" style="border: 2px dotted rgb(38, 38, 43); background-color: teal;"></div>
      <div class="col-sm-6 col-md-8" style="border: 2px dotted rgb(38, 38, 43); background-color: thistle;"></div>
    </div>

    <!-- Row 2 -->
    <div class="row g-0 justify-content-between" style="border: 5px solid rgb(255, 188, 188); height: 200px;">
      <div class="col-md-4 offset-md-2" style="border: 2px dotted rgb(38, 38, 43); background-color: tomato;"></div>
      <div class="col-md-4" style="border: 2px dotted rgb(38, 38, 43); background-color: turquoise;"></div>
    </div>

    <!-- Row 3 -->
    <div class="row g-0 justify-content-center" style="border: 5px solid rgb(255, 188, 188); height: 200px;">
      <div class="col-6 col-md-4" style="border: 2px dotted rgb(38, 38, 43); background-color: violet;"></div>
      <div class="col-6 col-md-4" style="border: 2px dotted rgb(38, 38, 43); background-color: yellowgreen;"></div>
    </div>

  </div>

</body>
</html>
